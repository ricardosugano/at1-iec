name: CI Backend

on:
  # Dispara automaticamente em qualquer push, em qualquer branch
  push:
  # Dispara em Pull Requests
  pull_request:
  # Permite execução manual pela aba Actions
  workflow_dispatch:

# Cancela execuções anteriores da mesma branch quando chega um commit novo
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Job 1: validações estáticas e testes (fail-fast)
  validacoes-e-testes:
    name: 1. Qualidade, Tipos e Testes
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: 1. Baixar o código-fonte
        uses: actions/checkout@v4

      - name: 2. Configurar o pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: 3. Configurar o Node.js 24 com cache do pnpm
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: 4. Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: 5. Análise estática (ESLint)
        run: pnpm run lint

      - name: 6. Verificar formatação (Prettier)
        run: pnpm run format:check

      - name: 7. Checagem de tipos (tsc --noEmit)
        run: pnpm run type-check

      - name: 8. Testes com Vitest
        run: pnpm run test:unit

  # Job 2: build de produção e imagem Docker (só roda se o Job 1 passar)
  build-e-docker:
    name: 2. Build e Imagem Docker
    needs: validacoes-e-testes
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: 1. Baixar o código-fonte
        uses: actions/checkout@v4

      - name: 2. Configurar o pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: 3. Configurar o Node.js 24 com cache do pnpm
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: 4. Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: 5. Build de produção (tsc)
        run: pnpm run build

      - name: 6. Validar build da imagem Docker da API
        run: docker build -t api-service:ci .

      - name: 7. Resumo da execução
        run: |
          echo "### Resumo do Pipeline de CI" >> $GITHUB_STEP_SUMMARY
          echo "Integração Contínua concluída com sucesso!" >> $GITHUB_STEP_SUMMARY
          echo "- Autor: ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "- Commit: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY